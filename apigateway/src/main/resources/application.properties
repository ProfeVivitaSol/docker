spring.application.name=apigateway


server.port=9090
spring.cloud.gateway.server.webmvc.routes[0].id=servicio-cancha
spring.cloud.gateway.server.webmvc.routes[0].uri=http://serviciocanchas:8083
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/canchas/**

spring.cloud.gateway.server.webmvc.routes[1].id=servicio-reservas
spring.cloud.gateway.server.webmvc.routes[1].uri=http://servicioreservas:8082
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/reservas/**    